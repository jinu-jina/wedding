<!DOCTYPE html>
<html lang="ko">
<head>

<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}

<body>
<canvas id="c" width="1920" height="1080"></canvas>
<audio id="au" src="close_to_you.mp3" preload="auto"></audio>
<script src="data.js"></script>
<script>
'use strict';
/* =========================================================================
   close_to_you.strudel — a live-coded ASCII wedding visual
   stage: 1920 x 1080 · everything below is drawn in real time
   ========================================================================= */
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const au = document.getElementById('au');
const D = window.DATA;
const FONT = '"JetBrains Mono","SF Mono","Menlo","Consolas","DejaVu Sans Mono","Liberation Mono",monospace';

/* ---------- palette ---------- */
const PAL = [
  [243,235,224], // 0 ivory
  [244,169,189], // 1 pink
  [226,194,139], // 2 gold
  [138,128,121], // 3 dim
  [250,214,223], // 4 blush
  [232,112,146], // 5 rose
  [255,255,255], // 6 white
  [125,211,252], // 7 sky blue
  [215,242,255], // 8 ice
];
const css = (i, a = 1) => `rgba(${PAL[i][0]},${PAL[i][1]},${PAL[i][2]},${a})`;
const BG = '#0b0a0b';

/* ---------- layout (recommended) ----------
   left   : live code editor
   center : the couple (ascii seals)  +  piano roll / chords
   right  : heart (music reactive)    +  ring (looping 3d ascii)
   header : file + realtime clock      footer : status / progress   */
const L = {
  header: { y: 22, h: 40 },
  code:   { x: 28,   y: 76, w: 620, h: 936, id: '00', name: 'close_to_you.strudel' },
  seal:   { x: 668,  y: 76, w: 620, h: 620, id: '03', name: 'couple.ascii' },
  roll:   { x: 668,  y: 716, w: 620, h: 296, id: '04', name: 'piano.roll' },
  heart:  { x: 1308, y: 76, w: 584, h: 520, id: '02', name: 'heart.dots' },
  ring:   { x: 1308, y: 616, w: 584, h: 396, id: '01', name: 'ring.ascii' },
  footer: { y: 1026 },
};

/* ---------- glyph atlas (fast ascii blitting) ---------- */
const CHARSET = " .,'`:;-_~^\"=+*!|/\\()[]{}<>?#&%@$abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789·•●○◇◆♥♡✦✧▁▂▃▄▅▆▇█▐▒░■□│─┼▲";
const CIDX = {}; [...CHARSET].forEach((c, i) => CIDX[c] = i);
const ALEV = 8; // alpha levels
function makeAtlas(size, lh) {
  const m = document.createElement('canvas').getContext('2d');
  m.font = `${size}px ${FONT}`;
  const cw = m.measureText('M').width;
  const ch = lh || Math.round(size * 1.18);
  const pw = Math.ceil(cw) + 4, ph = ch + 2;
  const n = [...CHARSET].length;
  const a = document.createElement('canvas');
  a.width = pw * n; a.height = ph * PAL.length * ALEV;
  const g = a.getContext('2d');
  g.font = `${size}px ${FONT}`; g.textBaseline = 'middle'; g.textAlign = 'center';
  [...CHARSET].forEach((c, i) => {
    for (let p = 0; p < PAL.length; p++) for (let al = 0; al < ALEV; al++) {
      g.fillStyle = css(p, (al + 1) / ALEV);
      g.fillText(c, i * pw + pw / 2, (p * ALEV + al) * ph + ph / 2 + 0.5);
    }
  });
  return { a, cw, ch, pw, ph, size };
}

class Grid {
  constructor(x, y, cols, rows, atlas) {
    Object.assign(this, { x, y, cols, rows, at: atlas });
    const n = cols * rows;
    this.c = new Uint8Array(n); this.p = new Uint8Array(n); this.al = new Uint8Array(n);
    this.z = new Float32Array(n);
  }
  clear() { this.c.fill(0); this.z.fill(-1e9); }
  set(i, j, ch, pal, a) {
    if (i < 0 || j < 0 || i >= this.cols || j >= this.rows) return;
    const k = j * this.cols + i; const ci = CIDX[ch]; if (ci === undefined) return;
    this.c[k] = ci; this.p[k] = pal; this.al[k] = Math.max(0, Math.min(ALEV - 1, (a * ALEV) | 0));
  }
  draw(g) {
    const { a, cw, ch, pw, ph } = this.at;
    for (let j = 0; j < this.rows; j++) for (let i = 0; i < this.cols; i++) {
      const k = j * this.cols + i, c = this.c[k]; if (!c) continue;
      g.drawImage(a, c * pw, (this.p[k] * ALEV + this.al[k]) * ph, pw, ph,
        this.x + i * cw - (pw - cw) / 2, this.y + j * ch - 1, pw, ph);
    }
  }
}

/* ---------- small helpers ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const hash = (x, y = 0) => { let h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); };
const pad = (n, w, ch = '0') => String(n).padStart(w, ch);
const RAMP = " .,:;-=+*ixXo#%@";
const rampChar = v => RAMP[Math.max(0, Math.min(RAMP.length - 1, Math.round(v * (RAMP.length - 1))))];

/* ---------- music clock (beats from offline analysis of the mp3) ---------- */
const BEATS = D.beats, PHASE = D.phase;
const IBI = 0.674;
function beatPos(t) {
  if (t < BEATS[0]) return (t - BEATS[0]) / IBI;
  let lo = 0, hi = BEATS.length - 1;
  if (t >= BEATS[hi]) return hi + (t - BEATS[hi]) / IBI;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (BEATS[m] <= t) lo = m; else hi = m; }
  return lo + (t - BEATS[lo]) / (BEATS[lo + 1] - BEATS[lo]);
}
// typing warp: keystrokes come in bursts right after each beat
function warp(t) { const b = beatPos(t); const i = Math.floor(b), f = b - i; return i + 1 - Math.pow(1 - f, 2.2); }

/* chords: collapse consecutive duplicates into change list */
const CH = [];
for (const [t, c] of D.chords) if (!CH.length || CH[CH.length - 1].c !== c) CH.push({ t, c });
CH.forEach((o, i) => o.end = i + 1 < CH.length ? CH[i + 1].t : 216.1);
function chordIndex(t) { let k = 0; for (let i = 0; i < CH.length; i++) if (CH[i].t <= t) k = i; return k; }
const NOTE_PC = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
function parseChord(c) {
  const m = c.match(/^([A-G][#b]?)(.*)$/); const root = m[1], q = m[2];
  const iv = { '': [0, 4, 7], m: [0, 3, 7], maj7: [0, 4, 7, 11], m7: [0, 3, 7, 10], '7': [0, 4, 7, 10], sus4: [0, 5, 7] }[q] || [0, 4, 7];
  return { root, pc: NOTE_PC[root], tones: iv.map(i => (NOTE_PC[root] + i) % 12) };
}
CH.forEach(o => Object.assign(o, parseChord(o.c)));

/* ============================== THE CODE =============================== */
/* every line is typed in sync with the beats; graphics appear as their code is typed */
const KEY_CHANGE = 94.9;
const DOC = [ // [id, text]   ({CH} / {BASS} / {KEY} are live, rewritten as the song changes)
  ['h1', '// close_to_you.strudel'],
  ['h2', '// a live-coded love song · for our wedding ♥'],
  ['b0', ''],
  ['cpm', 'setcpm(89/4)'],
  ['key', 'const scale = "{KEY}"'],
  ['b1', ''],
  ['r0', '// 01 — the ring'],
  ['r1', 'const ring = ascii.ring({ band: .32, gem: "brilliant" })'],
  ['r2', '  .rotate(sine.slow(8))'],
  ['r3', '  .sparkle(beat)'],
  ['r4', '  .orbit(2)                    // two of us'],
  ['b2', ''],
  ['k0', '// 02 — the heart'],
  ['k1', 'const heart = dots.heart({ fill: "halftone", dot: "round" })'],
  ['k2', '  .scale(env.attack(.02).release(.4))'],
  ['k3', '  .burst(onset)'],
  ['k4', '  .glow(1.4)                   // chorus'],
  ['k5', '  .rays(12)'],
  ['b3', ''],
  ['c0', '// 03 — the couple'],
  ['c1', 'const couple = ascii.video("dance.mp4")'],
  ['c2', '  .mask(["groom", "bride"])'],
  ['c3', '  .seq(["cam","bow","groom","bride","swim","hug"])'],
  ['c4', '  .confetti("♥")'],
  ['b4', ''],
  ['p0', '// 04 — the song'],
  ['p1', 'piano: chord("<{CH}>")'],
  ['p2', '  .voicing().s("piano").room(.6)'],
  ['p3', 'bass: note("<{BASS}>").s("piano")'],
  ['p4', '  .lpf(800).gain(.8)'],
  ['b5', ''],
  ['s0', 'stack(ring, heart, couple, piano, bass)'],
  ['s1', '  .out()'],
  ['b6', ''],
  ['f0', '// forever & always ♥'],
  ['f1', 'hush()'],
];
// typing events: [lineId, t0, t1]  (times in seconds of the song)
const EV = [
  ['h1', 0.1, 0.9], ['h2', 0.9, 1.9], ['b0', 1.9, 1.95], ['cpm', 1.95, 2.3], ['key', 2.3, 2.8],
  ['b1', 2.8, 2.85], ['r0', 2.85, 3.1], ['r1', 3.1, 4.2], ['r2', 4.2, 4.6], ['r3', 4.6, 5.0],
  ['b2', 5.0, 5.05], ['k0', 5.05, 5.3], ['k1', 5.3, 6.6], ['k2', 6.6, 7.5], ['k3', 7.5, 8.0],
  ['b3', 8.0, 8.05], ['c0', 8.05, 8.3], ['c1', 8.3, 9.3], ['c2', 9.3, 10.0], ['c3', 10.0, 11.0],
  ['b4', 11.0, 11.05], ['p0', 11.05, 11.3], ['p1', 11.3, 12.5], ['p2', 12.5, 13.5], ['p3', 13.5, 14.7], ['p4', 14.7, 15.4],
  ['b5', 15.4, 15.45], ['s0', 15.45, 16.6], ['s1', 16.6, 17.0],
  ['k4', 53.4, 56.0],          // first chorus: the heart glows
  ['r4', 75.0, 78.5],          // the ring gets two orbits
  ['k5', 108.0, 110.0],        // after the key change: rays
  ['c4', 121.5, 124.0],        // confetti
  ['b6', 201.6, 201.7], ['f0', 201.7, 205.5], ['f1', 209.6, 211.2],
];
const EVM = {}; EV.forEach(e => EVM[e[0]] = e);
const BLOCKS = { // reveal progress of each graphic = how much of its code is typed
  ring: ['r1', 'r2', 'r3'], heart: ['k1', 'k2', 'k3'], couple: ['c1', 'c2', 'c3'], roll: ['p1', 'p2', 'p3', 'p4'],
};
function typedFrac(id, t) {
  const e = EVM[id]; if (!e) return 1; if (t <= e[1]) return 0; if (t >= e[2]) return 1;
  return clamp((warp(t) - warp(e[1])) / Math.max(1e-6, warp(e[2]) - warp(e[1])));
}
function blockFrac(name, t) { const ids = BLOCKS[name]; let s = 0; ids.forEach(id => s += typedFrac(id, t)); return s / ids.length; }

function chordWindow(t) {
  const k = chordIndex(t); const s = Math.floor(k / 4) * 4;
  const list = CH.slice(s, s + 4); return { list, cur: k - s, group: s };
}
function liveText(id, raw, t) {
  if (raw.includes('{KEY}')) {
    // the modulation: backspace "G:major", type "Ab:major"
    const a = 'G:major', b = 'Ab:major';
    let v;
    if (t < KEY_CHANGE - 1.4) v = a;
    else if (t < KEY_CHANGE) v = a.slice(0, Math.round(a.length * (1 - smooth((t - (KEY_CHANGE - 1.4)) / 1.2))));
    else v = b.slice(0, Math.round(b.length * clamp((t - KEY_CHANGE) / 1.0)));
    let s = raw.replace('{KEY}', v);
    if (t > KEY_CHANGE + 1.0) s += '   // modulate ↑';
    return s;
  }
  if (raw.includes('{CH}') || raw.includes('{BASS}')) {
    const w = chordWindow(Math.max(t, 0.01));
    const toks = raw.includes('{CH}') ? w.list.map(o => o.c) : w.list.map(o => o.root.toLowerCase() + '2');
    return raw.replace(/\{CH\}|\{BASS\}/, toks.join(' '));
  }
  return raw;
}

/* ---------- tiny syntax highlighter ---------- */
const KW = /^(const|stack|setcpm|hush|chord|note|ascii|dots|env|sine|beat|onset)\b/;
function tokenize(s) {
  const out = []; let i = 0;
  while (i < s.length) {
    const r = s.slice(i);
    let m;
    if (r.startsWith('//')) { out.push([r, 3]); break; }
    if ((m = r.match(/^"[^"]*"?/))) { out.push([m[0], 2]); i += m[0].length; continue; }
    if ((m = r.match(KW))) { out.push([m[0], 1]); i += m[0].length; continue; }
    if ((m = r.match(/^\.?\d+(\.\d+)?/))) { out.push([m[0], 4]); i += m[0].length; continue; }
    if ((m = r.match(/^\.[a-zA-Z_]+/))) { out.push([m[0], 6]); i += m[0].length; continue; }
    if ((m = r.match(/^[a-zA-Z_][a-zA-Z_0-9]*/))) { out.push([m[0], 0]); i += m[0].length; continue; }
    out.push([s[i], 7]); i++;
  }
  return out;
}
const SYN = { 0: css(0, .92), 1: css(1), 2: css(2), 3: css(3, .85), 4: css(4), 6: css(0, .7), 7: css(3, .95) };

/* ============================ panel chrome ============================= */
function panel(p, t, status, on = 1) {
  ctx.save();
  ctx.strokeStyle = css(0, .13); ctx.lineWidth = 1;
  ctx.strokeRect(p.x + .5, p.y + .5, p.w - 1, p.h - 1);
  // corner ticks
  ctx.strokeStyle = css(1, .55);
  const k = 8;
  [[p.x, p.y, 1, 1], [p.x + p.w, p.y, -1, 1], [p.x, p.y + p.h, 1, -1], [p.x + p.w, p.y + p.h, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(x + .5 * sx, y + k * sy); ctx.lineTo(x + .5 * sx, y + .5 * sy); ctx.lineTo(x + k * sx, y + .5 * sy); ctx.stroke();
  });
  ctx.font = `11px ${FONT}`; ctx.textBaseline = 'middle';
  ctx.fillStyle = css(1, .9); ctx.fillText(p.id, p.x + 12, p.y + 14);
  ctx.fillStyle = css(0, .75); ctx.fillText(p.name, p.x + 36, p.y + 14);
  if (status) { ctx.textAlign = 'right'; ctx.fillStyle = css(3, .9); ctx.fillText(status, p.x + p.w - 12, p.y + 14); }
  ctx.restore();
}

/* ============================ 00 code editor ============================ */
const CODE_FS = 15, CODE_LH = 23;
let codeCW = 9;
function drawCode(t, beatF) {
  const p = L.code;
  panel(p, t, `ln ${pad(0, 2)} · utf-8`);
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x + 1, p.y + 28, p.w - 2, p.h - 30); ctx.clip();
  ctx.font = `${CODE_FS}px ${FONT}`; codeCW = ctx.measureText('M').width;
  ctx.textBaseline = 'middle';
  const x0 = p.x + 54, y0 = p.y + 46;
  // collect visible lines
  const vis = [];
  let cursor = null;
  let lastStart = -1;
  for (const [id, raw] of DOC) {
    const e = EVM[id]; if (!e || t < e[1]) continue;
    const full = liveText(id, raw, t);
    const f = typedFrac(id, t);
    const n = (raw.includes('{') && f >= 1) ? full.length : Math.round([...full].length * f);
    const shown = [...full].slice(0, n).join('');
    vis.push({ id, full, shown, f });
    if (e[1] >= lastStart) { lastStart = e[1]; cursor = { row: vis.length - 1, col: [...shown].length }; }
  }
  // if key change edit is active, the cursor jumps there
  if (t > KEY_CHANGE - 1.4 && t < KEY_CHANGE + 1.2) {
    const r = vis.findIndex(v => v.id === 'key'); if (r >= 0) cursor = { row: r, col: [...vis[r].shown].length - (t > KEY_CHANGE + 1.0 ? 16 : 0) - 1 };
  }
  // scroll so cursor stays in view
  const maxRows = Math.floor((p.h - 60) / CODE_LH);
  const scroll = Math.max(0, (cursor ? cursor.row : 0) - maxRows + 3);
  const hushT = EVM.f1[2];
  vis.forEach((v, r) => {
    const rr = r - scroll; if (rr < 0) return;
    const y = y0 + rr * CODE_LH;
    if (cursor && cursor.row === r) {
      ctx.fillStyle = css(1, .10); ctx.fillRect(p.x + 1, y - CODE_LH / 2, p.w - 2, CODE_LH);
      ctx.fillStyle = css(1, .9); ctx.fillRect(p.x + 1, y - CODE_LH / 2, 3, CODE_LH);
    }
    ctx.textAlign = 'right'; ctx.fillStyle = css(3, cursor && cursor.row === r ? .95 : .5);
    ctx.fillText(String(r + 1), x0 - 18, y);
    ctx.textAlign = 'left';
    let x = x0;
    for (const [s, k] of tokenize(v.shown)) { ctx.fillStyle = SYN[k]; ctx.fillText(s, x, y); x += ctx.measureText(s).width; }
    // live chord / bass highlight boxes
    if ((v.id === 'p1' || v.id === 'p3') && v.f >= 1) {
      const w = chordWindow(t), lt = v.full.indexOf('<') + 1;
      const toks = v.full.slice(lt, v.full.indexOf('>')).split(' ');
      let off = lt;
      toks.forEach((tk, i) => {
        if (i === w.cur) {
          const bx = x0 + off * codeCW - 2, bw = tk.length * codeCW + 4;
          ctx.strokeStyle = css(1, .95); ctx.lineWidth = 1.2; ctx.strokeRect(bx, y - 10, bw, 20);
          ctx.fillStyle = css(1, .14 + .2 * (1 - beatF)); ctx.fillRect(bx, y - 10, bw, 20);
        }
        off += tk.length + 1;
      });
    }
  });
  // blinking block cursor (blinks with the beat)
  if (cursor && t < hushT + 2) {
    const rr = cursor.row - scroll, y = y0 + rr * CODE_LH;
    if (beatF < .55 || (t % 1) < .5) { ctx.fillStyle = css(1, .95); ctx.fillRect(x0 + cursor.col * codeCW + 1, y - 9, codeCW - 1, 18); }
  }
  ctx.restore();
  // status line in panel header
  ctx.save(); ctx.font = `11px ${FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillStyle = BG; ctx.fillRect(p.x + p.w - 160, p.y + 4, 150, 20);
  ctx.fillStyle = css(3, .9);
  ctx.fillText(`ln ${pad(cursor ? cursor.row + 1 : 1, 2)} · col ${pad(cursor ? cursor.col + 1 : 1, 2)}`, p.x + p.w - 12, p.y + 14);
  ctx.restore();
}

/* ============================ 01 the ring ============================== */
let ringGrid, ringPts;
function buildRing() {
  const P = []; // x,y,z,nx,ny,nz,order,kind
  const R = 1.0, bw = 0.24, bt = 0.085; // radius, band width (z), thickness
  // band: draws itself from the bottom up, both sides
  for (let ia = 0; ia < 520; ia++) {
    const a = ia / 520 * Math.PI * 2;
    const ca = Math.cos(a), sa = Math.sin(a);
    const ang = Math.abs(((a + Math.PI / 2) % (Math.PI * 2)) - Math.PI); // 0 at top, pi at bottom
    const order = (1 - ang / Math.PI) * 0.55;
    for (let iv = 0; iv < 22; iv++) {
      const v = iv / 22 * Math.PI * 2;
      const cv_ = Math.cos(v), sv = Math.sin(v);
      const rr = R + bt * cv_;
      P.push([rr * ca, rr * sa, bw * sv, cv_ * ca, cv_ * sa, sv * 1.6, order + hash(ia, iv) * .02, 0]);
    }
  }
  // gem: brilliant cut — pavilion (down cone) + crown (up cone) + table
  const gy = R + 0.02, girdle = gy + 0.34, gr = 0.36, table = girdle + 0.19, tr = 0.2;
  for (let i = 0; i < 1400; i++) {
    const a = hash(i, 1) * Math.PI * 2, u = Math.sqrt(hash(i, 2));
    const facet = Math.floor(a / (Math.PI / 8)) + .5, fa = facet * Math.PI / 8;
    const r = gr * u, y = gy + (girdle - gy) * u;
    const nx = Math.cos(fa) * .7, nz = Math.sin(fa) * .7, ny = -.7;
    P.push([r * Math.cos(a), y, r * Math.sin(a), nx, ny, nz, .70 + (1 - u) * .1 + .1 * u, 1]);
  }
  for (let i = 0; i < 1100; i++) {
    const a = hash(i, 3) * Math.PI * 2, u = hash(i, 4);
    const facet = Math.floor(a / (Math.PI / 8)) + .5, fa = facet * Math.PI / 8;
    const r = lerp(gr, tr, u), y = lerp(girdle, table, u);
    P.push([r * Math.cos(a), y, r * Math.sin(a), Math.cos(fa) * .6, .8, Math.sin(fa) * .6, .86 + u * .06, 1]);
  }
  for (let i = 0; i < 380; i++) {
    const a = hash(i, 5) * Math.PI * 2, r = Math.sqrt(hash(i, 6)) * tr;
    P.push([r * Math.cos(a), table, r * Math.sin(a), 0, 1, 0, .93 + hash(i, 9) * .05, 1]);
  }
  // four prongs
  for (let k = 0; k < 4; k++) {
    const a = (k + .5) * Math.PI / 2;
    for (let i = 0; i < 70; i++) {
      const u = i / 69;
      const x = lerp(0.12, gr * 1.04, u) * Math.cos(a), z = lerp(0.12, gr * 1.04, u) * Math.sin(a);
      const y = lerp(R - .02, girdle + .07, u);
      P.push([x, y, z, Math.cos(a), .2, Math.sin(a), .58 + u * .1, 2]);
    }
  }
  ringPts = P;
}
function drawRing(t, A, rev, orbitOn) {
  const p = L.ring, g = ringGrid; g.clear();
  const live = rev >= 1; if (!live) t = 0.4;

    for (let r = 0; r < hgt; r++) {
      const fill = clamp(h - (hgt - 1 - r));
      if (fill <= 0) continue;
      g.set(c, top + r, sb[Math.min(7, Math.floor(fill * 8))], r < hgt * .35 ? 1 : 4, .35 + .6 * (r / hgt));
    }
  }
  g.draw(ctx);
  // current chord readout in the header
  ctx.save(); ctx.font = `11px ${FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillStyle = BG; ctx.fillRect(p.x + p.w - 220, p.y + 4, 210, 20);
  ctx.fillStyle = css(1); ctx.fillText(`chord ${CH[k].c}`, p.x + p.w - 12, p.y + 14);
  ctx.restore();
}

function idleText(p, s, t) {
  ctx.save(); ctx.font = `12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = css(3, .55 + .25 * Math.sin(t * 3));
  ctx.fillText(s + (Math.floor(t * 2) % 2 ? ' _' : '  '), p.x + p.w / 2, p.y + p.h / 2);
  ctx.restore();
}

/* ============================ audio analysis =========================== */
let actx = null, an = null, src = null, fbuf, prevSpec = new Float32Array(24), recDest = null;
function initAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  src = actx.createMediaElementSource(au);
  an = actx.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = .6;
  src.connect(an); an.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); an.connect(recDest);
  fbuf = new Uint8Array(an.frequencyBinCount);
}
const A = { bass: 0, mid: 0, energy: 0, onset: 0, spec: new Float32Array(24), beatEnv: 0, beatHit: false, down: false, dt: 1 / 60 };
let lastBeatIdx = -1;
function analyse(t, dt) {
  A.dt = Math.min(.05, dt);
  const sp = A.spec;
  if (an && !au.paused) {
    an.getByteFrequencyData(fbuf);
    // 24 log bands 40Hz..8kHz
    const nyq = actx.sampleRate / 2, N = fbuf.length;
    let flux = 0;
    for (let b = 0; b < 24; b++) {
      const f0 = 40 * Math.pow(200, b / 24), f1 = 40 * Math.pow(200, (b + 1) / 24);
      const i0 = Math.floor(f0 / nyq * N), i1 = Math.max(i0 + 1, Math.floor(f1 / nyq * N));
      let s = 0; for (let i = i0; i < i1; i++) s += fbuf[i]; s /= (i1 - i0) * 255;
      const v = clamp((s - .25) / .6);
      flux += Math.max(0, v - prevSpec[b]); prevSpec[b] = v;
      sp[b] = Math.max(v, sp[b] * .88);
    }
    // file:// playback can mute the analyser (CORS) — fall back to the offline energy curve
    let tot = 0; for (let i = 0; i < 64; i++) tot += fbuf[i];
    if (tot === 0 && t > .5) {
      const e = D.energy[Math.floor(t * 20)] || 0;
      for (let b = 0; b < 24; b++) sp[b] = Math.max(sp[b] * .85, clamp(e * (1.05 - b / 28) * (.75 + .25 * Math.sin(b * 1.7 + t * 5))));
      flux = A.beatEnv > .9 ? e * 2 : 0;
    }
    A.bass = lerp(A.bass, (sp[0] + sp[1] + sp[2] + sp[3] + sp[4]) / 5, .35);
    A.mid = lerp(A.mid, (sp[8] + sp[9] + sp[10] + sp[11] + sp[12]) / 5, .3);
    A.onset = Math.max(flux / 4, A.onset * .9);
  } else if (window.__fake) {
    for (let b = 0; b < 24; b++) sp[b] = clamp(.75 - b / 30 + .2 * Math.sin(b * 1.3 + t * 3));
    A.bass = .6; A.mid = .4; A.onset = .5;
  } else {
    for (let b = 0; b < 24; b++) sp[b] *= .92;
    A.bass *= .92; A.mid *= .92; A.onset *= .9;
  }
  const e = D.energy[Math.floor(t * 20)] || 0; A.energy = lerp(A.energy, e, .2);
  // beat envelope from the beat map
  const bp = beatPos(t), bi = Math.floor(bp);
  A.beatHit = false;
  if (bi !== lastBeatIdx && bi >= 0 && !au.paused) { A.beatHit = bi === lastBeatIdx + 1; lastBeatIdx = bi; A.down = ((bi - PHASE) % 4 + 4) % 4 === 0; }
  A.beatEnv = bp >= 0 ? Math.exp(-(bp - bi) * 4.5) : 0;
}

/* =============================== chrome ================================ */
function header(t) {
  const y = L.header.y + L.header.h / 2;
  ctx.save(); ctx.textBaseline = 'middle';
  ctx.font = `600 16px ${FONT}`; ctx.fillStyle = css(1); ctx.fillText('♥', 30, y);
  ctx.font = `15px ${FONT}`; ctx.fillStyle = css(0, .95); ctx.fillText('close_to_you.strudel', 54, y);
  const sx = 54 + ctx.measureText('close_to_you.strudel ').width;
  const sub = '— a wedding live session · 2026 12 05 ';
  ctx.fillStyle = css(3, .9); ctx.fillText(sub, sx, y);
  ctx.fillStyle = css(1, .95); ctx.fillText('jinwoo and jina', sx + ctx.measureText(sub).width, y);
  // realtime clock (song time + wall clock)
  const now = new Date();
  const bp = beatPos(t), bi = Math.floor(bp);
  const bar = Math.max(1, Math.floor((bi - PHASE) / 4) + 1), bt = ((bi - PHASE) % 4 + 4) % 4 + 1;
  ctx.textAlign = 'right';
  ctx.font = `13px ${FONT}`; ctx.fillStyle = css(3, .95);
  const right = `bar ${pad(bar, 3)}.${bt} │ 89 bpm │ ${pad(now.getHours(), 2)}:${pad(now.getMinutes(), 2)}:${pad(now.getSeconds(), 2)}`;
  ctx.fillText(right, 1892, y);
  const rw = ctx.measureText(right).width;
  ctx.font = `600 22px ${FONT}`; ctx.fillStyle = css(1);
  ctx.fillText(`t ${pad(t.toFixed(2), 6)}s`, 1892 - rw - 22, y + 1);
  ctx.restore();
}
let fpsS = 60;
function footer(t, dur) {
  const y = L.footer.y + 14;
  ctx.save(); ctx.textBaseline = 'middle'; ctx.font = `13px ${FONT}`;
  ctx.fillStyle = css(1); ctx.fillText('$', 30, y);
  ctx.fillStyle = css(0, .85); ctx.fillText('strudel wedding.js', 46, y);
  // progress
  const n = 48, f = clamp(t / dur), k = Math.floor(f * n);
  const bar = '[' + '■'.repeat(k) + '□'.repeat(n - k) + ']';
  const tm = s => `${pad(Math.floor(s / 60), 2)}:${pad(Math.floor(s % 60), 2)}`;
  ctx.textAlign = 'center'; ctx.fillStyle = css(1, .8);
  ctx.fillText(`${bar}  ${tm(t)} / ${tm(dur)}`, W / 2 + 20, y);
  ctx.textAlign = 'right'; ctx.fillStyle = css(3, .95);
  const st = recording ? '● rec' : (au.paused ? (t > 0 ? 'paused' : 'ready') : 'running');
  ctx.fillText(`${st} · ${Math.round(fpsS)} fps`, 1892, y);
  if (recording) { ctx.fillStyle = css(5); ctx.fillText('● rec', 1892 - ctx.measureText(` · ${Math.round(fpsS)} fps`).width, y); }
  ctx.restore();
}
function backdrop() {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = css(0, .035);
  for (let y = 70; y < 1016; y += 16) for (let x = 20; x < 1900; x += 16) ctx.fillRect(x, y, 1, 1);
}
let crt = true;
function crtFx(t) {
  if (!crt) return;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.10)'; for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* =============================== start ================================= */
function startScreen(t) {
  ctx.save();
  ctx.fillStyle = 'rgba(11,10,11,.82)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const art = ['  ♥♥♥   ♥♥♥  ', ' ♥♥♥♥♥ ♥♥♥♥♥ ', ' ♥♥♥♥♥♥♥♥♥♥♥ ', '  ♥♥♥♥♥♥♥♥♥  ', '    ♥♥♥♥♥    ', '      ♥      '];
  ctx.font = `20px ${FONT}`; ctx.fillStyle = css(1, .9);
  art.forEach((l, i) => ctx.fillText(l, W / 2, 380 + i * 24));
  ctx.font = `22px ${FONT}`; ctx.fillStyle = css(0);
  ctx.fillText('▶  click or press SPACE to start', W / 2, 560);
  ctx.font = `13px ${FONT}`; ctx.fillStyle = css(3);
  ctx.fillText('F fullscreen · R record → .webm · C crt · ← → seek 5s · 0 restart', W / 2, 600);
  ctx.restore();
}

/* =============================== loop ================================== */
let started = false, recording = false, rec = null, recChunks = [];
let lastNow = performance.now();
function frame(now) {
  const dt = (now - lastNow) / 1000; lastNow = now;
  if (dt > 0) fpsS = lerp(fpsS, 1 / dt, .05);
  const t = au.currentTime || 0, dur = au.duration || 216.03;
  analyse(t, dt);
  backdrop();
  header(t);
  const hushEnd = EVM.f1[2];
  const fade = 1 - smooth((t - hushEnd) / 3.5);
  const bp = beatPos(t), beatF = bp - Math.floor(bp);
  drawCode(t, beatF);
  ctx.save(); ctx.globalAlpha = Math.max(.0, fade);
  const fr = { ring: blockFrac('ring', t), heart: blockFrac('heart', t), couple: blockFrac('couple', t) };
  const st = (f, liveTxt) => f >= 1 ? liveTxt : f <= 0 ? 'paused ‖' : `compiling ${'▮'.repeat(Math.round(f * 8))}${'▯'.repeat(8 - Math.round(f * 8))} ${Math.round(f * 100)}%`;
  const dim = f => f >= 1 ? 1 : .42 + .25 * f;
  panel(L.ring, t, st(fr.ring, 'loop · running'));
  ctx.save(); ctx.globalAlpha *= dim(fr.ring); drawRing(t, A, fr.ring, typedFrac('r4', t)); ctx.restore();
  panel(L.heart, t, st(fr.heart, `onset ${A.onset.toFixed(2)} · bass ${A.bass.toFixed(2)}`));
  ctx.save(); ctx.globalAlpha *= dim(fr.heart); drawHeart(t, A, fr.heart >= 1, typedFrac('k4', t), typedFrac('k5', t)); ctx.restore();
  ctx.save(); ctx.globalAlpha *= dim(fr.couple); drawSeal(t, A, fr.couple >= 1, typedFrac('c4', t)); ctx.restore();
  panel(L.seal, t, st(fr.couple, `${sealInfo.name} · ${pad(sealInfo.fi + 1, 3)}/${sealInfo.n}`));
  panel(L.roll, t, ''); drawRoll(t, A, 1);
  ctx.restore();
  if (fade < 1) { // ending: a quiet heart
    ctx.save(); ctx.globalAlpha = 1 - fade; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `28px ${FONT}`; ctx.fillStyle = css(1); ctx.fillText('♥', 1280, 515);
    ctx.font = `16px ${FONT}`; ctx.fillStyle = css(0, .9); ctx.fillText('thank you for being with us', 1280, 555);
    ctx.restore();
  }
  footer(t, dur);
  crtFx(t);
  if (!started) startScreen(t);
  requestAnimationFrame(frame);
}

/* =============================== controls ============================== */
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();
async function start() {
  initAudio(); if (actx.state === 'suspended') await actx.resume();
  started = true; au.play();
}
function toggle() { if (!started) return start(); if (au.paused) au.play(); else au.pause(); }
function toggleRec() {
  if (!started) start();
  if (!recording) {
    const vs = cv.captureStream(60);
    const stream = new MediaStream([...vs.getVideoTracks(), ...recDest.stream.getAudioTracks()]);
    const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16e6 });
    recChunks = []; rec.ondataavailable = e => e.data.size && recChunks.push(e.data);
    rec.onstop = async () => {
      const b = new Blob(recChunks, { type: 'video/webm' });
      const filename = 'close_to_you_wedding_1920x1080.webm';
      try {
        const dl = window.claude && await window.claude.use('downloads');
        if (dl) {
          try { await dl.save({ filename, data: b }); }
          catch (e) { await dl.save({ filename, data: new Uint8Array(await b.arrayBuffer()), mimeType: 'video/webm' }); }
          return;
        }
      } catch (e) { console.warn('save declined', e); }
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = filename; a.click();
    };
    rec.start(1000); recording = true;
  } else { rec.stop(); recording = false; }
}
cv.addEventListener('click', toggle);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (e.key === 'r' || e.key === 'R') toggleRec();
  else if (e.key === 'c' || e.key === 'C') crt = !crt;
  else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('hidecursor');
  else if (e.key === 'ArrowRight') au.currentTime = Math.min((au.duration || 216) - .5, au.currentTime + 5);
  else if (e.key === 'ArrowLeft') au.currentTime = Math.max(0, au.currentTime - 5);
  else if (e.key === '0') { au.currentTime = 0; lastBeatIdx = -1; }
});
au.addEventListener('ended', () => { if (recording) toggleRec(); });

/* =============================== boot ================================== */
const atl9 = makeAtlas(9, 9), atl10 = makeAtlas(10, 11), atl12 = makeAtlas(12, 12), atl11 = makeAtlas(11, 12);
function gridIn(p, at, padTop = 30, padX = 10, padB = 8) {
  const cols = Math.floor((p.w - padX * 2) / at.cw), rows = Math.floor((p.h - padTop - padB) / at.ch);
  return new Grid(p.x + (p.w - cols * at.cw) / 2, p.y + padTop, cols, rows, at);
}
buildRing(); buildHeart(); buildSeal();
ringGrid = gridIn(L.ring, atl10);
sealGrid = gridIn(L.seal, atl9, 30, 6, 4);
rollGrid = gridIn(L.roll, atl11, 34, 12, 8);
// ?t=60 to jump (useful for previewing a section)
const qt = parseFloat(new URLSearchParams(location.search).get('t'));
if (!isNaN(qt)) au.currentTime = qt;
// preview hook (headless snapshots): fixed time + synthetic spectrum
window.__debugSetTime = s => {
  started = true; window.__fake = true;
  Object.defineProperty(au, 'currentTime', { get: () => s, configurable: true });
  Object.defineProperty(au, 'paused', { get: () => false, configurable: true });
};
requestAnimationFrame(frame);
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">

  <meta property="og:type" content="website">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:image" content="">
  <meta name="description" content="">

  <title>Wedding Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>
  
  <div id="envelopeOpening" class="envelope-opening">
    <div class="envelope">
      <img src="images/envelope/flap.png" class="envelope__flap" alt="">
      <img src="images/envelope/card.png" class="envelope__card" id="envelopeCard" alt="초대장">
      <img src="images/envelope/pocket.png" class="envelope__pocket" alt="">
      <div class="envelope__mask"></div>
    </div>
    <p class="envelope__guide" id="envelopeGuide">[ 화면을 터치해 주세요 ]</p>
  </div>
 
  <div id="toast" class="toast" aria-live="polite"></div>

 <div id="photoModal" class="photo-modal" role="dialog" aria-modal="true" aria-label="사진 보기">
    
    <button class="photo-modal__close" id="modalClose" aria-label="닫기">&times;</button>
    
    <span class="photo-modal__guide">양쪽 화살표 버튼 터치 혹은 좌우로<br>드래그하여 사진을 넘길 수 있습니다.</span>
    
    <button class="photo-modal__nav photo-modal__nav--prev" id="modalPrev" aria-label="이전 사진">&#8249;</button>
    <button class="photo-modal__nav photo-modal__nav--next" id="modalNext" aria-label="다음 사진">&#8250;</button>
    
    <div class="photo-modal__container" id="modalContainer">
      <img class="photo-modal__img" id="modalImg" src="" alt="사진" draggable="false">
    </div>
    
    <div class="photo-modal__counter" id="modalCounter"></div>
  </div>

  <main class="main-content">

    <section class="top-video-section">
      <video id="topVideo" src="images/video/main.mp4" loop muted playsinline></video>
      <canvas id="particleCanvas"></canvas>
      <audio id="bgm" src="images/video/song.mp3" loop preload="auto"></audio>
      <img src="images/video/tex.png" id="videoGuideText" class="video-guide-text" alt="화면 터치 시 배경음악 재생">
    </section>

    <section class="hero">
      <div class="hero__frame">
        
        <img src="images/hero/1.jpg" class="layer-1-bg" alt="배경 사진">
        
        <div class="tool-canvas-area" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;">
          <canvas id="canvas"></canvas>
        </div> 
        
        <img src="images/hero/1_top.png" class="layer-4-top" alt="메인 텍스트">
        
      </div>
    </section>

    <!-- ─── 인사말 ─── -->
    <section class="section greeting" id="greeting">
      <!-- 1. 상단 bg_01 영역 (소개글 텍스트) -->
      <div class="greeting__part1">
        <p class="greeting__text animate-item" data-animate="fade-up" id="greetingContent"></p>
      </div>

      <!-- 2. 하단 bg_02 영역 (레이스 장식 및 혼주 정보) -->
      <div class="greeting__part2">
        <div class="greeting__lace-wrapper animate-item" data-animate="fade-up">
          <!-- 베이스 레이스 이미지 -->
          <img src="images/greeting/lace.png" class="greeting__lace-base" alt="레이스 배경">
          <!-- 써지는 애니메이션 효과가 들어갈 캘리그라피 이미지 -->
          <img src="images/greeting/lace_tex.png" class="greeting__lace-tex" alt="레이스 텍스트">
          
          <!-- 혼주 정보 (script.js에서 자동으로 들어감) -->
          <div class="greeting__parents" id="greetingParents"></div>
        </div>
      </div>
    </section>

    <!-- ─── 갤러리 ─── -->
    <div class="alet-gallery" id="gallery">
  
  <!-- 💡 5번: 새로운 상단 좌측 정렬 타이틀 -->
  <div class="gallery-header-new">
    <h2 class="gallery-header-new__title">진우<span class="heart">🤍</span>진아<br>웨딩 앨범</h2>
    <p class="gallery-header-new__subtitle">
      좌우로 스크롤하여 이미지를 넘길 수 있습니다.<br>
      이미지를 터치하면 크게 보실 수 있습니다.
    </p>
  </div>

  <!-- 💡 2번: 갤러리 진입 시 중앙에서 커졌다 사라지는 애니메이션 텍스트 -->
  <div class="gallery-intro" id="galleryIntro">
    <p>좌우로 스크롤하여 이미지를 넘길 수 있습니다.<br>이미지를 터치하면 크게 보실 수 있습니다.</p>
  </div>

  <!-- 💡 3번: 라인 컨테이너에 애니메이션 제어를 위한 id="aletLines" 추가 -->
  <div class="alet-lines" id="aletLines">
    <div class="alet-line alet-line-h"></div>
    <div class="alet-line alet-line-v"></div>
    <div class="alet-line alet-line-d1"></div>
    <div class="alet-line alet-line-d2"></div>
  </div>

  <!-- 기존 갤러리 그리드 영역 (절대 건드리지 않음) -->
  <div class="alet-gallery__field" id="galleryGrid"></div>
  
  <!-- 💡 1번: 기존 하단에 있던 alet-gallery__bottom은 삭제되었습니다. -->
</div>
</section>

    <section class="section calendar-section" id="calendarSection">
      <div class="section__inner">
        <h2 class="section__title animate-item" data-animate="fade-up">예식 일시</h2>
        <div class="calendar animate-item" data-animate="scale-in" id="calendarGrid"></div>
        <div class="calendar-actions animate-item" data-animate="fade-up">
          <a class="btn btn--outline" id="googleCalBtn" href="#" target="_blank" rel="noopener">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
            Google 캘린더
          </a>
          <button class="btn btn--outline" id="icsDownloadBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M12 14v4M10 16l2 2 2-2"/></svg>
            Apple 캘린더
          </button>
        </div>
      </div>
    </section>

    <section class="section story" id="story">
      <div class="section__inner">
        <div class="trad-divider animate-item" data-animate="fade-in">
          <span class="trad-divider__line"></span>
          <span class="trad-divider__diamond"></span>
          <span class="trad-divider__line"></span>
        </div>
        <h2 class="section__title animate-item" data-animate="fade-up" id="storyTitle"></h2>
        <p class="story__text animate-item" data-animate="fade-up" id="storyContent"></p>
        <div class="story__photos" id="storyPhotos"></div>
      </div>
    </section>

    <section class="section location" id="location">
      <div class="section__inner">
        <div class="trad-divider animate-item" data-animate="fade-in">
          <span class="trad-divider__line"></span>
          <span class="trad-divider__diamond"></span>
          <span class="trad-divider__line"></span>
        </div>
        <h2 class="section__title animate-item" data-animate="fade-up">오시는 길</h2>
        <div class="location__info animate-item" data-animate="fade-up">
          <p class="location__venue" id="locationVenue"></p>
          <p class="location__hall" id="locationHall"></p>
          <p class="location__address" id="locationAddress"></p>
          <p class="location__tel" id="locationTel"></p>
        </div>
        <button class="btn btn--text location__copy animate-item" data-animate="fade-up" id="copyAddressBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          주소 복사
        </button>
        <div class="location__map animate-item" data-animate="scale-in">
          <img class="location__map-img" id="locationMapImg" src="" alt="약도" loading="lazy">
        </div>
        <div class="location__links animate-item" data-animate="fade-up">
          <a class="btn btn--kakao" id="kakaoMapBtn" href="#" target="_blank" rel="noopener">카카오맵</a>
          <a class="btn btn--naver" id="naverMapBtn" href="#" target="_blank" rel="noopener">네이버지도</a>
        </div>
      </div>
    </section>

    <section class="section account" id="account">
      <div class="section__inner">
        <h2 class="section__title animate-item" data-animate="fade-up">마음 전하실 곳</h2>
        <p class="account__desc animate-item" data-animate="fade-up">축하의 마음을 담아 축의금을 전달해 보세요.</p>

        <div class="accordion animate-item" data-animate="fade-up">
          <button class="accordion__trigger" id="groomAccordion" aria-expanded="false">
            <span class="accordion__icon">&#9670;</span>
            <span>신랑측 계좌번호</span>
            <svg class="accordion__arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="accordion__panel" id="groomAccordionPanel">
            <div class="accordion__panel-inner" id="groomAccountList"></div>
          </div>
        </div>

        <div class="accordion animate-item" data-animate="fade-up">
          <button class="accordion__trigger" id="brideAccordion" aria-expanded="false">
            <span class="accordion__icon">&#9670;</span>
            <span>신부측 계좌번호</span>
            <svg class="accordion__arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="accordion__panel" id="brideAccordionPanel">
            <div class="accordion__panel-inner" id="brideAccountList"></div>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="trad-divider trad-divider--footer">
        <span class="trad-divider__line"></span>
        <span class="trad-divider__diamond"></span>
        <span class="trad-divider__line"></span>
      </div>
      <p class="footer__text" id="footerText"></p>
    </footer>

  </main> <script src="brik.js"></script> 
  <script src="script.js"></script>
</body>
</html>

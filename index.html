<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">

  <!-- Meta / OG tags - config.js 값으로 script에서 동적 설정 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:image" content="">
  <meta name="description" content="">

  <title>Wedding Invitation</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700\&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>

  <!-- ═══ 초대장 열기 (편지 봉투) ═══ -->
<div id="envelopeOpening" class="envelope-opening">
    <div class="envelope">
      <img src="images/envelope/flap.png" class="envelope\_\_flap" alt="">
 
      <img src="images/envelope/card.png" class="envelope\_\_card" id="envelopeCard" alt="초대장">
 
      <img src="images/envelope/pocket.png" class="envelope\_\_pocket" alt="">
 
      <div class="envelope\_\_mask"></div>
    </div>
    <p class="envelope\_\_guide" id="envelopeGuide">화면을 터치해 주세요</p>
  </div>
 
  <!-- ═══ Toast Notification ═══ -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- ═══ Photo Viewer Modal ═══ -->
  <div id="photoModal" class="photo-modal" role="dialog" aria-modal="true" aria-label="사진 보기">
    <button class="photo-modal\_\_close" id="modalClose" aria-label="닫기">&times;</button>
    <button class="photo-modal\_\_nav photo-modal\_\_nav--prev" id="modalPrev" aria-label="이전 사진">&#8249;</button>
    <button class="photo-modal\_\_nav photo-modal\_\_nav--next" id="modalNext" aria-label="다음 사진">&#8250;</button>
    <div class="photo-modal\_\_container" id="modalContainer">
      <img class="photo-modal\_\_img" id="modalImg" src="" alt="사진" draggable="false">
    </div>
    <div class="photo-modal\_\_counter" id="modalCounter"></div>
  </div>

  <!-- ═══ Main Content ═══ -->
  <main id="mainContent" class="main-content">

    <!-- ─── 메인 (히어로) ─── -->
    <section class="section hero" id="hero">
      <div class="hero\_\_frame">
        <div class="hero\_\_frame-corner hero\_\_frame-corner--tl"></div>
        <div class="hero\_\_frame-corner hero\_\_frame-corner--tr"></div>
        <div class="hero\_\_frame-corner hero\_\_frame-corner--bl"></div>
        <div class="hero\_\_frame-corner hero\_\_frame-corner--br"></div>
      </div>
      <div class="hero\_\_overlay"></div>
      <img class="hero\_\_photo" id="heroPhoto" src="" alt="웨딩 사진" loading="eager">
      <div class="hero\_\_content">
        <p class="hero\_\_label animate-item" data-animate="fade-down">청 첩 장</p>
        <h1 class="hero\_\_names animate-item" data-animate="fade-up" id="heroNames"></h1>
        <div class="hero\_\_divider animate-item" data-animate="fade-in"></div>
        <p class="hero\_\_date animate-item" data-animate="fade-up" id="heroDate"></p>
        <p class="hero\_\_venue animate-item" data-animate="fade-up" id="heroVenue"></p>
      </div>

      <!-- D-day 카운트다운 -->
      <div class="countdown animate-item" data-animate="fade-up" id="countdown">
        <p class="countdown\_\_label" id="countdownLabel"></p>
        <div class="countdown\_\_timer">
          <div class="countdown\_\_item">
            <span class="countdown\_\_number" id="countDays">0</span>
            <span class="countdown\_\_unit">일</span>
          </div>
          <div class="countdown\_\_sep">:</div>
          <div class="countdown\_\_item">
            <span class="countdown\_\_number" id="countHours">0</span>
            <span class="countdown\_\_unit">시간</span>
          </div>
          <div class="countdown\_\_sep">:</div>
          <div class="countdown\_\_item">
            <span class="countdown\_\_number" id="countMinutes">0</span>
            <span class="countdown\_\_unit">분</span>
          </div>
          <div class="countdown\_\_sep">:</div>
          <div class="countdown\_\_item">
            <span class="countdown\_\_number" id="countSeconds">0</span>
            <span class="countdown\_\_unit">초</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ─── 인사말 ─── -->
    <section class="section greeting" id="greeting">
      <div class="section\_\_inner">
        <div class="trad-divider animate-item" data-animate="fade-in">
          <span class="trad-divider\_\_line"></span>
          <span class="trad-divider\_\_diamond"></span>
          <span class="trad-divider\_\_line"></span>
        </div>
        <h2 class="section\_\_title animate-item" data-animate="fade-up" id="greetingTitle"></h2>
        <p class="greeting\_\_text animate-item" data-animate="fade-up" id="greetingContent"></p>
        <div class="greeting\_\_parents animate-item" data-animate="fade-up" id="greetingParents"></div>
      </div>
    </section>

    <!-- ─── 예식 일시 (달력) ─── -->
    <section class="section calendar-section" id="calendarSection">
      <div class="section\_\_inner">
        <h2 class="section\_\_title animate-item" data-animate="fade-up">예식 일시</h2>
        <div class="calendar animate-item" data-animate="scale-in" id="calendarGrid"></div>
        <div class="calendar-actions animate-item" data-animate="fade-up">
          <a class="btn btn--outline" id="googleCalBtn" href="#" target="\_blank" rel="noopener">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
            Google 캘린더
          </a>
          <button class="btn btn--outline" id="icsDownloadBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M12 14v4M10 16l2 2 2-2"/></svg>
            Apple 캘린더
          </button>
        </div>
      </div>
    </section>

    <!-- ─── 우리의 이야기 ─── -->
    <section class="section story" id="story">
      <div class="section\_\_inner">
        <div class="trad-divider animate-item" data-animate="fade-in">
          <span class="trad-divider\_\_line"></span>
          <span class="trad-divider\_\_diamond"></span>
          <span class="trad-divider\_\_line"></span>
        </div>
        <h2 class="section\_\_title animate-item" data-animate="fade-up" id="storyTitle"></h2>
        <p class="story\_\_text animate-item" data-animate="fade-up" id="storyContent"></p>
        <div class="story\_\_photos" id="storyPhotos"></div>
      </div>
    </section>

    <!-- ─── 갤러리 ─── -->
    <section class="section gallery" id="gallery">
      <div class="section\_\_inner">
        <h2 class="section\_\_title animate-item" data-animate="fade-up">갤러리</h2>
        <div class="gallery\_\_grid" id="galleryGrid"></div>
      </div>
    </section>

    <!-- ─── 오시는 길 ─── -->
    <section class="section location" id="location">
      <div class="section\_\_inner">
        <div class="trad-divider animate-item" data-animate="fade-in">
          <span class="trad-divider\_\_line"></span>
          <span class="trad-divider\_\_diamond"></span>
          <span class="trad-divider\_\_line"></span>
        </div>
        <h2 class="section\_\_title animate-item" data-animate="fade-up">오시는 길</h2>
        <div class="location\_\_info animate-item" data-animate="fade-up">
          <p class="location\_\_venue" id="locationVenue"></p>
          <p class="location\_\_hall" id="locationHall"></p>
          <p class="location\_\_address" id="locationAddress"></p>
          <p class="location\_\_tel" id="locationTel"></p>
        </div>
        <button class="btn btn--text location\_\_copy animate-item" data-animate="fade-up" id="copyAddressBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          주소 복사
        </button>
        <div class="location\_\_map animate-item" data-animate="scale-in">
          <img class="location\_\_map-img" id="locationMapImg" src="" alt="약도" loading="lazy">
        </div>
        <div class="location\_\_links animate-item" data-animate="fade-up">
          <a class="btn btn--kakao" id="kakaoMapBtn" href="#" target="\_blank" rel="noopener">카카오맵</a>
          <a class="btn btn--naver" id="naverMapBtn" href="#" target="\_blank" rel="noopener">네이버지도</a>
        </div>
      </div>
    </section>

    <!-- ─── 마음 전하실 곳 (축의금) ─── -->
    <section class="section account" id="account">
      <div class="section\_\_inner">
        <h2 class="section\_\_title animate-item" data-animate="fade-up">마음 전하실 곳</h2>
        <p class="account\_\_desc animate-item" data-animate="fade-up">축하의 마음을 담아 축의금을 전달해 보세요.</p>

        <!-- 신랑측 계좌 -->
        <div class="accordion animate-item" data-animate="fade-up">
          <button class="accordion\_\_trigger" id="groomAccordion" aria-expanded="false">
            <span class="accordion\_\_icon">&#9670;</span>
            <span>신랑측 계좌번호</span>
            <svg class="accordion\_\_arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="accordion\_\_panel" id="groomAccordionPanel">
            <div class="accordion\_\_panel-inner" id="groomAccountList"></div>
          </div>
        </div>

        <!-- 신부측 계좌 -->
        <div class="accordion animate-item" data-animate="fade-up">
          <button class="accordion\_\_trigger" id="brideAccordion" aria-expanded="false">
            <span class="accordion\_\_icon">&#9670;</span>
            <span>신부측 계좌번호</span>
            <svg class="accordion\_\_arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="accordion\_\_panel" id="brideAccordionPanel">
            <div class="accordion\_\_panel-inner" id="brideAccountList"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ─── Footer ─── -->
    <footer class="footer">
      <div class="trad-divider trad-divider--footer">
        <span class="trad-divider\_\_line"></span>
        <span class="trad-divider\_\_diamond"></span>
        <span class="trad-divider\_\_line"></span>
      </div>
      <p class="footer\_\_text" id="footerText"></p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
